name: SQL static validation
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  parse-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SQLFluff
        run: python -m pip install sqlfluff
      - name: Parse SQL scripts using T-SQL dialect
        shell: bash
        run: |
          set -e
          find sql -type f -name '*.sql' -print0 | while IFS= read -r -d '' file; do
            echo "Parsing $file"
            sqlfluff parse --dialect tsql "$file" >/dev/null
          done
